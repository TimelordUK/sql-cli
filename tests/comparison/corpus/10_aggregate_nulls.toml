# Tier 10 — aggregate and NULL edge semantics.
#
# Added 2026-08-02, seeded with P14. Tier 7 covers GROUP BY / HAVING over
# non-empty groups; what it never asked is what an aggregate does when there is
# nothing to aggregate. See SQL_PARITY.md.

# --- The baselines that work, so P14 is isolated to the empty ungrouped case ---

[[case]]
id = "count_nonempty"
data = "international_sales.csv"
sql = "SELECT COUNT(*) AS n FROM international_sales WHERE region = 'Europe'"

[[case]]
id = "grouped_aggregate_empty"
data = "international_sales.csv"
sql = "SELECT region, COUNT(*) AS n FROM international_sales WHERE region = 'Nowhere' GROUP BY region"
# AGREEs on zero rows, correctly: a GROUPED aggregate over no rows has no groups
# to report. This is what makes P14 specifically about the UNGROUPED form.

# --- P14: an ungrouped aggregate over an empty set returns no row at all ---

[[case]]
id = "count_star_empty"
data = "international_sales.csv"
sql = "SELECT COUNT(*) AS n FROM international_sales WHERE region = 'Nowhere'"
expect = "DIFFER"
# P14. Returns 0 rows; standard SQL returns exactly one row containing 0.

[[case]]
id = "sum_empty"
data = "international_sales.csv"
sql = "SELECT SUM(amount) AS total FROM international_sales WHERE region = 'Nowhere'"
expect = "DIFFER"
# P14, the NULL-returning half: one row containing NULL, not zero rows. COUNT
# and SUM differ in the value they must produce, so both are pinned.

[[case]]
id = "min_max_empty"
data = "international_sales.csv"
sql = "SELECT MIN(amount) AS lo, MAX(amount) AS hi FROM international_sales WHERE region = 'Nowhere'"
expect = "DIFFER"
# P14, multi-aggregate form — the single output row must carry a NULL per
# aggregate, so a fix that emits one row must fill every column.

# ---------------------------------------------------------------------------
# NULL semantics. Uses null_edges.csv — see the fixture notes in 08_ordering.toml.
# ---------------------------------------------------------------------------

# --- Baselines: the NULL handling that is already correct ---

[[case]]
id = "agg_ignores_nulls"
data = "null_edges.csv"
sql = "SELECT COUNT(*) AS rows_n, COUNT(score) AS score_n, SUM(score) AS s, AVG(score) AS a FROM null_edges"
# COUNT(*) counts rows, COUNT(col) skips NULLs, SUM/AVG skip NULLs. All correct.

[[case]]
id = "agg_all_null_group"
data = "null_edges.csv"
sql = "SELECT COUNT(*) AS n, COUNT(score) AS nn, SUM(score) AS s FROM null_edges WHERE team = 'delta'"
# Every score in team 'delta' is NULL: COUNT(*)=2, COUNT(score)=0, SUM=NULL.
# Distinct from P14 — here there ARE rows, they just aggregate to nothing.

[[case]]
id = "group_by_null_key"
data = "null_edges.csv"
sql = "SELECT team, COUNT(*) AS n FROM null_edges GROUP BY team"
# NULL forms its own group, correctly. Deliberately has NO ORDER BY so the
# harness compares as a multiset — adding `ORDER BY team` would drag P17's NULL
# placement in and make this case about ordering instead of grouping.

[[case]]
id = "distinct_with_nulls"
data = "null_edges.csv"
sql = "SELECT DISTINCT score FROM null_edges"

[[case]]
id = "count_distinct_with_nulls"
data = "null_edges.csv"
sql = "SELECT COUNT(DISTINCT score) AS d FROM null_edges"

[[case]]
id = "where_is_null"
data = "null_edges.csv"
sql = "SELECT id FROM null_edges WHERE score IS NULL ORDER BY id"

[[case]]
id = "where_not_equal_excludes_null"
data = "null_edges.csv"
sql = "SELECT id FROM null_edges WHERE score <> 50 ORDER BY id"
# Correct: `<>` excludes NULL rows. Contrast with NOT IN below, which does not —
# the inconsistency is what makes P19 a bug rather than a design choice.

[[case]]
id = "where_in_with_null_col"
data = "null_edges.csv"
sql = "SELECT id FROM null_edges WHERE score IN (50, 70) ORDER BY id"

[[case]]
id = "join_on_null_key"
data = "null_edges.csv"
sql = "SELECT a.id AS aid, b.id AS bid FROM null_edges a JOIN null_edges b ON a.partner_id = b.id ORDER BY a.id"
# NULL never equals NULL in a join key, so the 5 NULL partner_id rows drop out.

[[case]]
id = "join_on_null_key_both_sides"
data = "null_edges.csv"
sql = "SELECT a.id AS aid, b.id AS bid FROM null_edges a JOIN null_edges b ON a.label = b.label ORDER BY a.id, b.id"
expect = "DIFFER"
# P52, found 2026-09-13 writing R13. The case above only has NULL on ONE side
# (partner_id against the never-NULL id), so it cannot see this: with NULL keys
# on both sides, the 5 NULL-label rows pair with each other. We return 32 rows
# (7 + 5x5), DuckDB 7. Both join paths do it: this equi-join takes the hash
# path, where `canonical_join_key` passes NULL through as an ordinary HashMap
# key, so a NULL probe finds the NULL build rows; the nested-loop path uses
# compare_with_op, which also reports NULL = NULL as equal. R13 slice 6.

[[case]]
id = "null_arithmetic"
data = "null_edges.csv"
sql = "SELECT id, score + 1 AS plus FROM null_edges ORDER BY id"
# NULL + 1 = NULL. Correct — which makes P20 below the odd one out.

[[case]]
id = "coalesce_null"
data = "null_edges.csv"
sql = "SELECT id, COALESCE(score, -1) AS c FROM null_edges ORDER BY id"

# --- P18: `= NULL` matches instead of yielding UNKNOWN ---

[[case]]
id = "where_equals_null"
data = "null_edges.csv"
sql = "SELECT id FROM null_edges WHERE score = NULL"
# P18, FIXED 2026-08-22. We used to return the four NULL-score rows — `= NULL`
# was being treated as `IS NULL`. Under SQL three-valued logic `x = NULL` is
# UNKNOWN for every row including NULL ones, so the correct answer is zero rows.
# `IS NULL` (above) is the only way to match a NULL and it already worked.
#
# Root cause was one line in `compare_values`: `(Null, Null) => Some(Equal)`.
# That is *correct* for ORDER BY, which needs NULLs to group together, and the
# WHERE evaluator was reusing the same answer. The fix tests for NULL at the
# predicate layer instead of changing the shared comparator.

# --- P19: NOT IN does not exclude NULLs ---

[[case]]
id = "where_not_in_excludes_null"
data = "null_edges.csv"
sql = "SELECT id FROM null_edges WHERE score NOT IN (50, 70) ORDER BY id"
# P19, FIXED 2026-08-22. We used to return 8 rows, including the NULL-score
# rows; DuckDB returns 4. `NULL NOT IN (50, 70)` is UNKNOWN, not TRUE, so those
# rows must not pass. `where_not_equal_excludes_null` above already got the
# equivalent case right, which is what marked this as an inconsistency inside
# our own NULL handling rather than a considered rule.
#
# The fix is in `evaluate_in_list`: IN is `x = a OR x = b OR ...`, so when
# nothing matches but some comparison was UNKNOWN, the answer is UNKNOWN, not
# FALSE. Under NOT that difference is the entire bug — FALSE negates to TRUE.

# --- P20: `||` treats NULL as an empty string ---

[[case]]
id = "null_concat"
data = "null_edges.csv"
sql = "SELECT id, team || '-' || label AS c FROM null_edges ORDER BY id"
expect = "DIFFER"
# P20. Row 2 (label IS NULL) gives us 'alpha-' where DuckDB gives NULL.
# Concatenating NULL yields NULL in standard SQL. Oracle takes our view, so
# this one is arguably a coercion-first design choice rather than a bug — it
# needs a decision recorded, not an automatic fix.


# ---------------------------------------------------------------------------
# P41 — MODE tie-breaking. Added 2026-09-06 with the fix.
#
# MODE had no tie-break rule at all: it took whichever entry `HashMap`
# iteration surfaced last, so a tie returned a different value between runs of
# the same binary. These cases pin the rule the reference engine uses —
# earliest-seen value wins — which is only observable on a tie, so the corpus
# needs a tie where the answer is NOT the value a plausible alternative rule
# would pick.
#
# MODE is numeric-only for us (see P42), so every case here uses a numeric
# column. The string form is where the divergence is easiest to see, and it is
# exactly what we cannot yet express.
# ---------------------------------------------------------------------------

[[case]]
id = "mode_two_way_tie"
data = "null_edges.csv"
sql = "SELECT MODE(score) AS m FROM null_edges"
# 50 appears twice and 70 appears twice — a two-way tie, won by 50 on
# first-seen. This is also the case where first-seen and "smallest wins" happen
# to agree, which is exactly why it cannot stand alone.

[[case]]
id = "mode_tie_first_seen_not_smallest"
data = "null_edges.csv"
sql = "SELECT MODE(partner_id) AS m FROM null_edges"
# The discriminating case. Every non-NULL partner_id is distinct
# (3, 1, 5, 4, 8, 7, 11), so all seven tie at one occurrence. First-seen gives
# 3; "smallest value wins" — the rule P41 was originally going to adopt — gives
# 1. DuckDB gives 3. Without this case the corpus cannot tell the two apart.

[[case]]
id = "mode_all_null"
data = "null_edges.csv"
sql = "SELECT MODE(bonus) AS m FROM null_edges"
# Every bonus is NULL. NULLs are ignored, so there is nothing to tally and the
# answer is NULL rather than an error or a missing row.

[[case]]
id = "mode_grouped"
data = "null_edges.csv"
sql = "SELECT team, MODE(score) AS m FROM null_edges GROUP BY team ORDER BY team"
# Per-group state: each group must tally independently, and the all-NULL group
# ('delta') must still produce its row with NULL. Catches a fix applied to the
# ungrouped path only.

# --- P47: MIN/MAX compare by type variant before value ---

[[case]]
id = "max_mixed_int_float"
data = "null_edges.csv"
sql = "WITH t AS (SELECT 1 AS v UNION ALL SELECT 2.5 AS v UNION ALL SELECT 10 AS v) SELECT MAX(v) AS mx FROM t"
expect = "DIFFER"
# P47, found 2026-09-12 writing examples/countries.sql. One column holding both
# Integer and Float values: MAX returns 2.5 because DataValue's derived
# PartialOrd ranks the Float variant above Integer regardless of the numbers.
# DuckDB returns 10. The table is irrelevant to the query - the literal CTE is
# the smallest shape that produces a mixed-type column deterministically.

[[case]]
id = "min_mixed_int_float"
data = "null_edges.csv"
sql = "WITH t AS (SELECT 5 AS v UNION ALL SELECT 2.5 AS v UNION ALL SELECT 10 AS v) SELECT MIN(v) AS mn FROM t"
expect = "DIFFER"
# The mirror of the case above, and it needs the true minimum to BE the float:
# we return 5 (an Integer beats any Float for MIN), DuckDB returns 2.5. With
# the values of the MAX case this would pass for the wrong reason.

[[case]]
id = "max_mixed_int_float_from_csv"
data = "countries.csv"
sql = "SELECT MAX(area) AS mx FROM countries"
expect = "DIFFER"
# P47 as it is actually met. Three of the 250 areas carry decimals (Monaco
# 2.02, US Minor Outlying Islands 34.2, Vatican City 0.44) and they appear late
# in the file, so CSV type inference leaves the column mixed Integer/Float.
# MAX(area) is then 34.2 instead of 17098242 - the largest country in the world
# by a factor of half a million. Keep this alongside the literal-CTE cases: a
# fix that only handles literals would leave this one wrong.
