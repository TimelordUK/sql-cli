# Tier 6 — CTEs and set operations.

[[case]]
id = "cte_single"
data = "international_sales.csv"
sql = "WITH x AS (SELECT region, amount FROM international_sales) SELECT region, amount FROM x"

[[case]]
id = "cte_multiple"
data = "international_sales.csv"
sql = "WITH a AS (SELECT region, SUM(amount) AS total FROM international_sales GROUP BY region), b AS (SELECT region FROM a WHERE total > 5000) SELECT region FROM b"

[[case]]
id = "cte_referencing_cte"
data = "international_sales.csv"
sql = "WITH base AS (SELECT region, amount FROM international_sales), agg AS (SELECT region, SUM(amount) AS total FROM base GROUP BY region) SELECT region, total FROM agg"

[[case]]
id = "union"
data = "trades.csv"
sql = "SELECT symbol FROM trades WHERE price > 186 UNION SELECT symbol FROM trades WHERE price < 184"

[[case]]
id = "union_all"
data = "international_sales.csv"
sql = "SELECT region FROM international_sales WHERE amount > 2000 UNION ALL SELECT region FROM international_sales WHERE amount < 100"

[[case]]
id = "intersect"
data = "international_sales.csv"
sql = "SELECT region FROM international_sales WHERE amount > 2000 INTERSECT SELECT region FROM international_sales WHERE amount < 1000"
# Was P6 ("INTERSECT is not yet implemented"). Implemented 2026-07-25 in the
# set-op path; INTERSECT DISTINCT keeps rows present in both sides. Returns
# {Europe} — a non-trivial result (some regions are on only one side).

[[case]]
id = "except"
data = "international_sales.csv"
sql = "SELECT region FROM international_sales EXCEPT SELECT region FROM international_sales WHERE amount > 3000"
# Was P6 ("EXCEPT is not yet implemented"). Implemented 2026-07-25 alongside
# INTERSECT. Threshold is 3000 (not 2000) deliberately: every region has a sale
# > 2000, so that form is trivially empty and would pass for the wrong reason.
# > 3000 leaves {Oceania} — a real left-minus-right difference.

[[case]]
id = "recursive_cte"
data = "trades.csv"
sql = "WITH RECURSIVE n(i) AS (SELECT 1 UNION ALL SELECT i + 1 FROM n WHERE i < 5) SELECT i FROM n"
# Recursive CTEs are a known, considered, deferred design item (not supported).
expect = "GAP"

[[case]]
id = "cte_in_expression_position"
data = "trades.csv"
sql = "SELECT symbol, price FROM trades WHERE price > (WITH avg_cte AS (SELECT AVG(price) AS a FROM trades) SELECT a FROM avg_cte)"
# Was P12: WITH was rejected in expression position ("Unexpected token in
# primary expression: With"). Fixed 2026-07-25 — the subquery-detection guards
# now accept a leading WITH (parse_subquery already dispatched it to the CTE
# parser). DuckDB allows a CTE inside a scalar subquery; now AGREE.

[[case]]
id = "scalar_subquery_in_cte_select_list"
data = "international_sales.csv"
sql = "WITH z AS (SELECT region, amount - (SELECT AVG(amount) FROM international_sales) AS d FROM international_sales) SELECT region, d FROM z ORDER BY region, d"
expect = "GAP"
# P38, added 2026-09-02. "Unsupported expression type for arithmetic
# evaluation: ScalarSubquery { ... }". A scalar subquery in a CTE body's SELECT
# list is never evaluated. Located by the two controls below: the same
# expression at the top level AGREEs, and plain arithmetic inside a CTE AGREEs
# -- so this is the CTE SELECT-list path specifically, not scalar subqueries
# and not CTEs.

[[case]]
id = "scalar_subquery_in_select_arithmetic"
data = "international_sales.csv"
sql = "SELECT region, amount - (SELECT AVG(amount) FROM international_sales) AS d FROM international_sales ORDER BY region, d"
# Control for P38: identical expression at the TOP level. AGREEs, which is what
# puts the P38 fix site in the CTE SELECT-list path rather than in the
# arithmetic evaluator's handling of ScalarSubquery in general.

[[case]]
id = "plain_arithmetic_in_cte_select_list"
data = "international_sales.csv"
sql = "WITH z AS (SELECT region, amount * 2 AS d FROM international_sales) SELECT region, d FROM z ORDER BY region, d"
# Control for P38: arithmetic inside a CTE with no subquery. AGREEs, so CTE
# SELECT-list arithmetic is not broken in general -- only the ScalarSubquery arm.
