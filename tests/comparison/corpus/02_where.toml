# Tier 2 — WHERE: comparisons, boolean logic, IN, BETWEEN, LIKE, NULL, subqueries.

[[case]]
id = "where_numeric_gt"
data = "trades.csv"
sql = "SELECT symbol, price FROM trades WHERE price > 185"

[[case]]
id = "where_string_eq"
data = "trades.csv"
sql = "SELECT symbol, price FROM trades WHERE symbol = 'AAPL'"

[[case]]
id = "where_and_or"
data = "international_sales.csv"
sql = "SELECT * FROM international_sales WHERE region = 'Europe' AND amount > 1000 OR currency = 'GBP'"

[[case]]
id = "where_in_list"
data = "international_sales.csv"
sql = "SELECT * FROM international_sales WHERE currency IN ('USD', 'EUR')"

[[case]]
id = "where_not_in"
data = "international_sales.csv"
sql = "SELECT * FROM international_sales WHERE currency NOT IN ('USD')"

[[case]]
id = "where_between"
data = "trades.csv"
sql = "SELECT symbol, price FROM trades WHERE price BETWEEN 180 AND 190"

[[case]]
id = "where_like_prefix"
data = "instruments.csv"
sql = "SELECT instrument_id, name FROM instruments WHERE name LIKE 'A%'"

[[case]]
id = "where_like_contains"
data = "instruments.csv"
sql = "SELECT instrument_id, name FROM instruments WHERE name LIKE '%Stock%'"

[[case]]
id = "where_is_null"
data = "instruments.csv"
sql = "SELECT instrument_id FROM instruments WHERE coupon_rate IS NULL"

[[case]]
id = "where_is_not_null"
data = "instruments.csv"
sql = "SELECT instrument_id FROM instruments WHERE coupon_rate IS NOT NULL"

[[case]]
id = "where_not_expr"
data = "trades.csv"
sql = "SELECT symbol FROM trades WHERE NOT (price > 185)"

[[case]]
id = "where_arith_predicate"
data = "trades.csv"
sql = "SELECT symbol, price, volume FROM trades WHERE price * volume > 200000"

[[case]]
id = "where_in_subquery"
data = "international_sales.csv"
sql = "SELECT region, amount FROM international_sales WHERE amount > (SELECT AVG(amount) FROM international_sales)"

[[case]]
id = "where_in_subquery_set"
data = "trades.csv"
sql = "SELECT symbol FROM trades WHERE symbol IN (SELECT symbol FROM trades WHERE price > 185)"

[[case]]
id = "select_alias_in_in_subquery"
data = "trades.csv"
sql = "SELECT symbol, price * 2 AS dbl FROM trades WHERE dbl IN (SELECT price * 2 FROM trades WHERE price > 185)"
# Was P11: a SELECT alias on the LHS of an IN-subquery errored ("Column 'dbl'
# not found"). Fixed 2026-07-25 in two layers: (1) WhereAliasExpander migrated
# onto walk::map_children, which visits the subquery LHS operand (the alias)
# while leaving the subquery body opaque; (2) the substituted IN-list's LHS may
# be an arbitrary expression (price*2), which the IN-subquery path never lifted,
# so evaluate_in_list/between now evaluate an expression LHS via the arithmetic
# evaluator. Now AGREE.

# --- P29 / P30: IN combined with another condition ---

[[case]]
id = "in_list_then_and"
data = "null_edges.csv"
sql = "SELECT id FROM null_edges WHERE score IN (50, 70) AND team = 'alpha' ORDER BY id"
# P29, FIXED 2026-08-08. A boolean operator FOLLOWING an `IN (...)` predicate was
# not parsed: until P13 stage 1 the remainder was silently discarded (4 rows
# instead of 2), after it the query was a hard error. Root cause was IN being
# applied outside the OR/AND hierarchy — see P30 below, same bug.

[[case]]
id = "in_subquery_then_and"
data = "null_edges.csv"
sql = "SELECT id FROM null_edges WHERE score IN (SELECT score FROM null_edges WHERE id < 5) AND team = 'alpha' ORDER BY id"
# P29, the subquery form — pinned separately because the IN-list and IN-subquery
# paths are built differently (see P11) and a fix to one need not reach the other.
# In the event the P29/P30 precedence fix covered both, since they share
# `parse_in_operator`. Keep it: it is the control that proves that.
#
# It now DIFFERs on a *different* finding, which the parse error had been hiding:
# the subquery yields the scores of ids 1-4, which include id 3's NULL, and
# `NULL IN (.., NULL, ..)` matches for us where DuckDB gives UNKNOWN. 3 rows vs 2.
# That is P18 (`= NULL` matches instead of yielding UNKNOWN) reaching IN through
# the shared equality — see in_list_with_null_literal below, which isolates it
# without a subquery. Re-pin to AGREE when P18 is fixed.

[[case]]
id = "and_then_in_list"
data = "null_edges.csv"
sql = "SELECT id, team, score FROM null_edges WHERE team = 'alpha' AND score IN (50, 70) ORDER BY id"
# P30, FIXED 2026-08-08, and it was the more alarming of the pair: with the
# operands this way round the query PARSED and returned ZERO rows where the
# answer is 2 (ids 1 and 2, both score 50).
#
# Filed as an evaluation bug; it was not. IN was applied at the top of
# parse_expression, outside the OR/AND hierarchy, so this parsed as
#   InList { expr: (team = 'alpha' AND score), values: [50, 70] }
# — "is this boolean one of 50 or 70?" — false for every row. Same root cause as
# P29 above; the operand order only decided whether the mis-parse produced a
# wrong answer or leftover tokens.

[[case]]
id = "in_list_then_or"
data = "null_edges.csv"
sql = "SELECT id, team, score FROM null_edges WHERE score IN (50) OR team = 'beta' ORDER BY id"
# Added with the P29/P30 fix. The defect was in how IN bound relative to the
# whole OR/AND hierarchy, so OR needs pinning in both operand orders too — AND
# alone would not have caught a fix that only reached parse_logical_and.

[[case]]
id = "or_then_in_list"
data = "null_edges.csv"
sql = "SELECT id, team, score FROM null_edges WHERE team = 'beta' OR score IN (50) ORDER BY id"
# Added with the P29/P30 fix; the OR mirror of and_then_in_list.

[[case]]
id = "in_list_with_null_literal"
data = "null_edges.csv"
sql = "SELECT id FROM null_edges WHERE score IN (50, NULL) ORDER BY id"
# P18, found 2026-08-08 while fixing P29/P30, FIXED 2026-08-22 — the literal-list
# form that isolates what in_subquery_then_and trips over, with no subquery
# involved. A NULL in the list used to match every NULL-scored row: we returned
# ids 1,2,3,10,11,12 where DuckDB returns 1,2. IN is built on the same equality
# as `= NULL`, which is why one fix closed both.
#
# Discriminating pair: where_in_with_null_col (tier 10) AGREEs — a NULL column
# value against a list with NO NULL in it is excluded correctly. The variable
# that matters is a NULL *in the list*, not a NULL in the column.

[[case]]
id = "in_list_between_two_conditions"
data = "null_edges.csv"
sql = "SELECT id, team, score FROM null_edges WHERE team = 'alpha' AND score IN (50, 70) AND id < 3 ORDER BY id"
# Added with the P29/P30 fix. IN in the MIDDLE of a chain — the case that needs
# parse_comparison to both consume the IN and hand control back to the AND loop.
# The old top-level placement could not express this at all.

# --- P32: NOT LIKE does not parse ---

[[case]]
id = "not_like_pattern"
data = "null_edges.csv"
sql = "SELECT id FROM null_edges WHERE label NOT LIKE 'a%' ORDER BY id"
expect = "GAP"
# P32, found 2026-08-22 while verifying the P18/P19 fix against DuckDB. `NOT`
# only accepts `IN` after it, so this is a parse error: "Expected IN after NOT".
# Pre-existing — confirmed against main, unrelated to the three-valued-logic
# work — and pinned here rather than fixed in that change, per the standing
# rule that a divergence found while fixing something else gets its own entry.
#
# Worth having as a case regardless of the parse gap: DuckDB returns ids
# 1,3,4,7,8,9 — note it EXCLUDES the NULL-label rows (2,5,10,11,12), which is
# the same UNKNOWN-under-NOT rule as P19. So when the parse gap is closed, this
# doubles as coverage that NOT LIKE inherits the fixed NULL semantics; the
# evaluator side is already implemented and returns UNKNOWN for a NULL operand.

# --- P46: a column-to-column comparison in WHERE returned zero rows ---
# FIXED 2026-09-13. All eight cases below were DIFFER and now AGREE. Every WHERE
# operand (both comparison sides, IN-list items, BETWEEN bounds) now resolves
# through one `evaluate_operand_value`, and the literal-only reader that
# answered NULL for any other shape is gone.

[[case]]
id = "where_col_lt_col"
data = "null_edges.csv"
sql = "SELECT id, partner_id FROM null_edges WHERE id < partner_id ORDER BY id"
# P46, found 2026-09-12 writing examples/countries.sql. Both operands are
# columns, and that alone is enough: we return NO rows, DuckDB returns
# 1,4,7,9 (the NULL-partner rows are correctly excluded by both).
# The same comparison in the SELECT list is right - see
# 01_select.toml :: select_col_vs_col_projected.

[[case]]
id = "where_col_eq_col_string"
data = "instruments.csv"
sql = "SELECT instrument_id, currency, trading_currency FROM instruments WHERE currency = trading_currency ORDER BY instrument_id LIMIT 5"
# P46 again, on strings and on equality, to pin that the defect is the
# column-vs-column *shape* rather than one operator or one type. DuckDB matches
# 57 of the 200 rows; we match none.

# The cases below were added 2026-09-13 when P46 was re-probed from a second
# angle. The cause turned out wider than "column vs column": every right-hand
# operand of a WHERE predicate went through a literal-only reader that answered
# NULL for anything else - a column, a CASE, an expression - so the predicate
# was UNKNOWN on every row. These pin each site that reader served.

[[case]]
id = "where_col_eq_same_col"
data = "null_edges.csv"
sql = "SELECT id FROM null_edges WHERE team = team ORDER BY id"
# The tell from the P46 entry: the same column on both sides. No type, no
# coercion, no data involved. DuckDB keeps every non-NULL team (all but 7, 8).

[[case]]
id = "where_not_col_lt_col"
data = "null_edges.csv"
sql = "SELECT id FROM null_edges WHERE NOT (id < partner_id) ORDER BY id"
# P46 under NOT. DuckDB: 2, 5, 8 - the NULL-partner rows stay out, because
# NOT UNKNOWN is UNKNOWN. Guards the fix against landing as "false" for NULL.

[[case]]
id = "where_not_expr_lt_col"
data = "null_edges.csv"
sql = "SELECT id FROM null_edges WHERE NOT (id + 0 < partner_id) ORDER BY id"
# The one P46-adjacent shape that did NOT return zero rows: an arithmetic
# operand sent the whole comparison to the ArithmeticEvaluator, which answers
# false (not NULL) for a NULL operand - P48 leaking into WHERE. Under NOT that
# admits the NULL-partner rows: we returned 8 rows, DuckDB 2, 5, 8.

[[case]]
id = "where_col_lt_case"
data = "null_edges.csv"
sql = "SELECT id FROM null_edges WHERE score < CASE WHEN team = 'alpha' THEN 60 ELSE 40 END ORDER BY id"
# Not a column at all on the right - a CASE - and the same zero rows. DuckDB:
# 1, 2, 5, 8, 9 (rows 7/8 have a NULL team, so the WHEN is UNKNOWN and they
# take the ELSE bound of 40).

[[case]]
id = "where_between_col_bound"
data = "null_edges.csv"
sql = "SELECT id FROM null_edges WHERE partner_id BETWEEN id AND 10 ORDER BY id"
# BETWEEN's bounds used the same literal-only reader. DuckDB: 1, 4, 7
# (row 9's partner 11 is above the literal upper bound).

[[case]]
id = "where_in_list_expr_item"
data = "null_edges.csv"
sql = "SELECT id FROM null_edges WHERE partner_id IN (id + 2, 5) ORDER BY id"
# And IN-list items. The literal 5 still matched, so this one hid as a
# too-few-rows answer rather than an empty one: we returned only 4, DuckDB
# 1, 4, 9.

[[case]]
id = "where_literal_on_left"
data = "null_edges.csv"
sql = "SELECT id FROM null_edges WHERE 3 < id ORDER BY id"
# The mirror of P46: the LEFT operand had to be a column, so a literal there was
# a hard error ("Expected column name, got: NumberLiteral"). Found in the P46
# re-probe, and reported independently from the countries demo as
# `WHERE 1=0` being rejected while `LIMIT 0` worked. Fixed by the same change -
# both operands now resolve through one path. Was never in the corpus, so it
# lands as AGREE.

[[case]]
id = "where_constant_true"
data = "null_edges.csv"
sql = "SELECT id FROM null_edges WHERE 1 = 1 AND team = 'beta' ORDER BY id"
# The `WHERE 1=1 AND ...` idiom that generated SQL leans on. Constant-false is
# the more natural probe, but an empty result cannot be compared by the harness
# today (our empty JSON carries no column list), so the true form pins it.

# --- P54: an integer literal beyond 2^53 ---

[[case]]
id = "where_big_int_literal_equals"
data = "big_ids.csv"
sql = "SELECT id, name FROM big_ids WHERE id = 9007199254740993"
# P54, fixed by R13 slice 4 (WHERE comparisons delegate). WHERE read a number
# literal through f64, which cannot hold every integer above 2^53, so
# 9007199254740993 became 9007199254740992 and the filter returned *the
# neighbouring row* (bravo) instead of alpha. A 64-bit id is the realistic
# shape. SELECT's evaluator parses i64 first and was right all along.
#
# Keep `name` in the SELECT list: the harness compares numbers as floats, so
# both ids render as 9007199254740992.0 and an id-only query AGREEs whichever
# row comes back.

[[case]]
id = "where_big_int_literal_in_list"
data = "big_ids.csv"
sql = "SELECT id, name FROM big_ids WHERE id IN (9007199254740993, 12) ORDER BY id"
# The control for the case above. Already AGREE: R13 slice 4 part 1 delegated
# IN to the value evaluator, which fixed it for IN and BETWEEN without anyone
# noticing - no case held an integer this large.
