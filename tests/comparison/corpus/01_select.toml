# Tier 1 — vanilla SELECT: projection, DISTINCT, aliases, arithmetic, ORDER BY.
# Computed columns are aliased so column names line up across engines.

[[case]]
id = "select_star"
data = "trades.csv"
sql = "SELECT * FROM trades"
tier = "01"

[[case]]
id = "select_columns"
data = "trades.csv"
sql = "SELECT symbol, price, volume FROM trades"

[[case]]
id = "select_alias"
data = "trades.csv"
sql = "SELECT symbol AS ticker, price AS px FROM trades"

[[case]]
id = "select_arithmetic"
data = "trades.csv"
sql = "SELECT symbol, price * volume AS notional FROM trades"

[[case]]
id = "select_constant"
data = "trades.csv"
sql = "SELECT symbol, 1 AS one, 'x' AS lit FROM trades"

[[case]]
id = "distinct_single"
data = "trades.csv"
sql = "SELECT DISTINCT symbol FROM trades"

[[case]]
id = "distinct_multi"
data = "international_sales.csv"
sql = "SELECT DISTINCT region, currency FROM international_sales"

[[case]]
id = "order_by_asc"
data = "trades.csv"
sql = "SELECT symbol, price FROM trades ORDER BY price ASC"

[[case]]
id = "order_by_desc"
data = "trades.csv"
sql = "SELECT symbol, price FROM trades ORDER BY price DESC"

[[case]]
id = "order_by_multi"
data = "international_sales.csv"
sql = "SELECT region, country, amount FROM international_sales ORDER BY region ASC, amount DESC"

[[case]]
id = "order_by_limit"
data = "trades.csv"
sql = "SELECT symbol, price FROM trades ORDER BY price DESC LIMIT 5"

[[case]]
id = "order_by_expr"
data = "trades.csv"
sql = "SELECT symbol, price, volume FROM trades ORDER BY price * volume DESC"

# --- P46 contrast: the comparison that fails in WHERE works in projection ---

[[case]]
id = "select_col_vs_col_projected"
data = "null_edges.csv"
sql = "SELECT id, partner_id, id < partner_id AS lt FROM null_edges WHERE partner_id IS NOT NULL ORDER BY id"
# The anchor for P46. Column-vs-column is evaluated correctly HERE, which is
# what localises that bug to the WHERE evaluator rather than to comparison in
# general. If this case ever starts failing, P46 is bigger than filed.
# The NULL rows are excluded on purpose - they are P48's business, not P46's,
# and they are pinned separately as select_col_vs_col_null_operand below.

[[case]]
id = "select_col_vs_col_null_operand"
data = "null_edges.csv"
sql = "SELECT id, partner_id, id < partner_id AS lt FROM null_edges ORDER BY id"
expect = "DIFFER"
# P48, found 2026-09-12 while building the P46 anchor above. Same query without
# the IS NOT NULL guard: for a NULL operand we project false, DuckDB projects
# NULL. The three-valued-logic fix of P18/P19 landed in the WHERE evaluator;
# this is the same rule missing at the projection site.

# --- R13 slice 1 (2026-09-13): the value evaluator is two-valued ---
# tests/evaluator_matrix_tests.rs runs 36 predicates through both evaluators;
# the WHERE evaluator agrees with DuckDB on all 36 and the value evaluator on 4.
# These pin the projection-visible faults end to end. All are R13 slice 2.

[[case]]
id = "select_eq_null_literal"
data = "null_edges.csv"
sql = "SELECT id, score = NULL AS eq FROM null_edges ORDER BY id"
expect = "DIFFER"
# P48. `= NULL` is UNKNOWN for every row. The value evaluator compares NULL to
# NULL as *equal*, so the NULL-scored rows project TRUE - P18, the bug R10 fixed
# in WHERE, still live in SELECT.

[[case]]
id = "select_in_list_with_null"
data = "null_edges.csv"
sql = "SELECT id, score IN (50, NULL) AS hit FROM null_edges ORDER BY id"
expect = "DIFFER"
# P48. A NULL probe matches the NULL item (TRUE, should be NULL), and a
# non-matching score against a list holding NULL is FALSE (should be NULL).

[[case]]
id = "select_and_with_null"
data = "null_edges.csv"
sql = "SELECT id, (score > 40 AND team = 'alpha') AS both FROM null_edges ORDER BY id"
expect = "DIFFER"
# P48. AND collapses each side through to_bool (NULL -> false), so TRUE AND
# UNKNOWN projects false instead of NULL. Parenthesised because the bare form
# does not parse: see select_and_unparenthesised (P51).

[[case]]
id = "select_and_unparenthesised"
data = "null_edges.csv"
sql = "SELECT id, score > 40 AND team = 'alpha' AS both FROM null_edges ORDER BY id"
expect = "GAP"
# P51, found 2026-09-13 building the R13 matrix. AND/OR are not accepted in a
# SELECT item: "Unexpected keyword 'AND' after end of statement". The
# parenthesised form above parses. A parser gap, not an evaluator one.

[[case]]
id = "simple_case_when_null"
data = "null_edges.csv"
sql = "SELECT id, CASE score WHEN NULL THEN 'matched null' ELSE 'other' END AS k FROM null_edges ORDER BY id"
expect = "DIFFER"
# P48, pinned 2026-09-13 at the start of R13 slice 2. A simple CASE compares the
# operand to each WHEN value with `=`, so `CASE x WHEN NULL` never matches - every
# row is 'other'. Ours compares (Null, Null) as equal and the NULL-scored rows
# report 'matched null'. Not a predicate, so the evaluator matrix cannot see it.
