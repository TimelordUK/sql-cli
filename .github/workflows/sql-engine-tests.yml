name: SQL Engine Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Rust
      uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        toolchain: stable
        
    - name: Build Release Binary
      run: cargo build --release
      
    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true
        cache-dependency-glob: "pyproject.toml"
        
    - name: Set up Python
      run: uv python install 3.12
      
    - name: Install Python dependencies
      run: uv sync
      
    - name: Generate test data
      run: |
        uv run python scripts/generate_simple_test.py
        uv run python scripts/generate_arithmetic_test.py || true
        
    - name: Run SQL Engine Tests
      run: uv run pytest tests/test_sql_engine_pytest.py -v --tb=short
      
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: |
          .pytest_cache/
          test_results/
          
    - name: Test Report Summary
      if: always()
      run: |
        echo "## SQL Engine Test Results" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        uv run pytest tests/test_sql_engine_pytest.py --tb=no -q || true